<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add New Book</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #17243b, #304b70);
            color: #243247;
        }


        .form-card {
            width: 600px;
            max-width: 580px;
            padding: 38px 42px;
            background-color: #ffffff;
            border: 1px solid #dce3ec;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
        }


        .form-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 22px;
            border-bottom: 1px solid #e4e9f0;
        }

        .form-header h1 {
            margin: 0 0 10px;
            font-size: 29px;
            font-weight: 700;
            color: #203754;
        }

        .form-header p {
            margin: 0;
            font-size: 14px;
            line-height: 1.8;
            color: #778397;
        }
        form p {
            margin: 0 0 21px;
        }

        form label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 600;
            color: #34465f;
        }
        form input:not([type="checkbox"]):not([type="radio"]),
        form select,
        form textarea {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #d4dce7;
            border-radius: 9px;
            background-color: #f9fafc;
            color: #243247;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        form input[type="file"] {
            padding: 9px;
            cursor: pointer;
        }


        form textarea {
            min-height: 115px;
            resize: vertical;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            border-color: #426da5;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(66, 109, 165, 0.13);
        }

        .form-card ul {
            padding-left: 20px;
            color: #b42318;
            font-size: 13px;
        }

        .form-card .helptext {
            display: block;
            margin-top: 6px;
            color: #7a8798;
            font-size: 12px;
        }

        .submit-btn {
            width: 100%;
            min-height: 49px;
            margin-top: 7px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #263f60, #416b9d);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(38, 63, 96, 0.25);
        }

        .submit-btn:active {
            transform: translateY(0);
        }


        .back-link {
            display: block;
            margin-top: 21px;
            text-align: center;
            color: #526984;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #203754;
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <main class="form-card">

        <header class="form-header">
            <h1>Add a New Book</h1>
            <p>
                Please Add Valid Book
            </p>
        </header>

        <form action="{% url 'add book' %}"
              method="post"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}
                <button type="submit" class="submit-btn">
                    Save Book
                </button>

        </form>

        <a href="{% url 'home'%}" class="back-link">
            ← Back to Home
        </a>

    </main>

</body>
</html>
