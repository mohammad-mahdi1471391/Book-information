<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <title>GENRE</title>

    <style>
        body {
            background-color: white;
            margin: 0;
            padding: 0;
        }


        .search {
            display: flex;
            justify-content: end;
            align-items: end;
            margin-top: -68px;
            margin-right: 80px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 0.2fr);
        }

        .card {
            background-color: #c8d7d2;
            border-color: #778397;
            border-width: 10px;
            border-radius: 13px;
            padding: 5px;
            transition: 0.3s;

        }

        .card:hover {
            transform: translateY(-9px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            background-color: goldenrod;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .grid2 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 90px;
        }


        .search-background {
            background-color: #304b70;
            width: 100%;
            height: 130px;
            margin: 0 ;
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(2, 0.8fr);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .genres {
            font-family: 'Bauhaus 93';
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
            padding: 15px 25px;
            background-color: #f4f6f9;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .genre-link {
            display: inline-block;
            padding: 10px 16px;
            color: #304b70;
            text-decoration: none;
            font-size: 17px;
            border-radius: 8px;
            transition: 0.25s ;
        }

        .genre-link:hover {
            background-color: #304b70;
            color: white;
            transform: translateY(-2px);
        }
        .img1{
            display: flex;
            width:150px;
            height:100px;
        }
        .button1 {
            border-radius: 3px ;
            background-color: cadetblue ;
            width: 90px ;
            height: 40px;
            white-space: nowrap;
            font-family: 'Bauhaus 93';
            margin-right: 10px ;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 93%;
            margin-top: -75px;
            transition: 0.25s;
        }
        .button1:hover {
            background-color: #34ff00;
            color: black;
            transform: translateY(-2px);
        }
        .input1 {
            display: grid;
            width:500px;
            height: 45px;
            margin-left: 100px;
        }

    </style>




</head>
<body>
<div class="search-background">
    <div class="img1">
        <img src="{% static 'picture\logo.png' %}" alt="logo" >
    </div>
    <div class="search">
        <form method="GET" action="{% url 'search_books' %}" onsubmit="return this.q.value.trim() !== ''">
            <div class="grid">
                <div class="input1">
                    <input
                            style="border-radius: 10px;font-family: 'Bauhaus 93';font-size: 20px;"
                            type="search"
                            name="q"
                            placeholder="Search Books, Author,Keyword "
                            value="{{ request.GET.q|default:'' }}"
                        >
                </div>
                    <button type="submit" style="border-radius: 8px ; background-color: #1778FF"><img src="{% static 'picture/search-icon.png' %}" width= 30px height= 33px></button>
            </div>
        </form>
    </div>
    {% if not user.is_authenticated %}
        <a href="{% url 'users-login' %}" style="text-decoration: none; color: black;">
            <div class="button1">
                <div class="grid3">
                    <img src="{% static 'picture/profile.png' %}" width= 30px height= 30px>
                    Sign in
                </div>
            </div>
        </a>

    {% else %}
        <a href="{% url 'add book' %}" style="text-decoration: none; color: black;">
            <div class="button1">
                    Add Book
            </div>
        </a>
    {%endif%}
</div>

<div class="genres">
    {% for genre in categories %}
        <a href="{% url 'books list' category=genre.name %}" class="genre-link">
            {{ genre.name }}
        </a>
    {% endfor %}
</div>

<br>



    <div class="grid2">
        {% for book in books %}
            <a href='{{book.name}}/' style="text-decoration: none; color: black;" >
                <div class="card">
                        <div class="image-container">
                            <img src="{{book.img}}" alt="book" width="200" height="250" >
                        </div>
                    <h1 style="font-size: 20px">{{ book.name }}</h1>
                    <p style="color: #1778FF">{{ book.author }}</p>
                </div>
            </a>
        {% endfor %}
    </div>







</body>
</html>
